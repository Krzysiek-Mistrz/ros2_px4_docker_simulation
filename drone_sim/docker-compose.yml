services:
  px4:
    build: .
    image: px4-sim-custom:latest
    container_name: ros2_px4_sim
    stdin_open: true
    tty: true
    network_mode: host
    privileged: true
    environment:
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=${XAUTH:-/tmp/.docker.xauth}
      - XDG_RUNTIME_DIR=/tmp/runtime-root
    volumes:
      - .:/home/px4/ros2   # <<-- host ./ros2 persists to container /home/px4/ros2
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTH:-/tmp/.docker.xauth}:/tmp/.docker.xauth:rw
      - /dev/shm:/dev/shm
      - /dev:/dev  # Mount all devices (simpler approach)
    # Alternative: use device_cgroup_rules for dynamic device access
    device_cgroup_rules:
      - 'c 166:* rmw'  # Allow all ACM devices (ttyACM*)
      - 'c 188:* rmw'  # Allow all USB serial devices (ttyUSB*)
    working_dir: /home/px4/ros2 
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    command: ["bash", "-lc", "tail -f /dev/null"]
